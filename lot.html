<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMC Lot Calculator</title>
    <style>
        :root {
            --bg-color: #121418;
            --card-bg: #1e222d;
            --accent: #2962ff;
            --accent-hover: #1e51d8;
            --text-main: #d1d4dc;
            --text-sub: #787b86;
            --border: #2a2e39;
            --green: #089981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .calculator {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }

        h2 {
            font-size: 1.2rem;
            margin-bottom: 16px;
            color: #ffffff;
            text-align: center;
            letter-spacing: 0.5px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-bottom: 6px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: #ffffff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--accent);
        }

        .result-box {
            margin-top: 20px;
            padding: 16px;
            background-color: var(--bg-color);
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }

        .result-item:last-child {
            margin-bottom: 0;
        }

        .result-main {
            border-top: 1px solid var(--border);
            padding-top: 10px;
            margin-top: 10px;
        }

        .result-main .val {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--green);
        }

        .val {
            font-weight: 600;
            color: #ffffff;
        }
    </style>
</head>
<body>

<div class="calculator">
    <h2>Lot Kalkulyatoru</h2>
    
    <div class="form-group">
        <label for="symbol">Alət</label>
        <select id="symbol" onchange="calculateLot()">
            <option value="XAUUSD">XAUUSD (Qızıl)</option>
            <option value="EURUSD">EURUSD</option>
            <option value="GBPUSD">GBPUSD</option>
        </select>
    </div>

    <div class="form-group">
        <label for="balance">Balans (USD)</label>
        <input type="number" id="balance" placeholder="10000" value="10000" oninput="calculateLot()">
    </div>

    <div class="form-group">
        <label for="risk">Risk (%)</label>
        <input type="number" id="risk" step="0.1" placeholder="1" value="1" oninput="calculateLot()">
    </div>

    <div class="form-group">
        <label for="entry">Giriş Qiyməti (Entry)</label>
        <input type="number" id="entry" step="any" placeholder="Məs: 2650.50" oninput="calculateLot()">
    </div>

    <div class="form-group">
        <label for="sl">Stop Loss (SL)</label>
        <input type="number" id="sl" step="any" placeholder="Məs: 2645.00" oninput="calculateLot()">
    </div>

    <div class="result-box">
        <div class="result-item">
            <span>Risk Məbləği:</span>
            <span class="val" id="riskAmount">$0.00</span>
        </div>
        <div class="result-item">
            <span>Qiymət Məsafəsi:</span>
            <span class="val" id="distance">0.00</span>
        </div>
        <div class="result-item result-main">
            <span>Tövsiyə Edilən Lot:</span>
            <span class="val" id="lotResult">0.00</span>
        </div>
    </div>
</div>

<script>
    function calculateLot() {
        const symbol = document.getElementById('symbol').value;
        const balance = parseFloat(document.getElementById('balance').value) || 0;
        const riskPct = parseFloat(document.getElementById('risk').value) || 0;
        const entry = parseFloat(document.getElementById('entry').value) || 0;
        const sl = parseFloat(document.getElementById('sl').value) || 0;

        const riskAmountSpan = document.getElementById('riskAmount');
        const distanceSpan = document.getElementById('distance');
        const lotResultSpan = document.getElementById('lotResult');

        if (balance <= 0 || riskPct <= 0 || entry <= 0 || sl <= 0 || entry === sl) {
            riskAmountSpan.innerText = "$0.00";
            distanceSpan.innerText = "0.00";
            lotResultSpan.innerText = "0.00";
            return;
        }

        const riskAmount = balance * (riskPct / 100);
        const distance = Math.abs(entry - sl);
        
        // Contract Size: XAUUSD = 100, EURUSD/GBPUSD = 100,000
        const contractSize = (symbol === 'XAUUSD') ? 100 : 100000;
        
        const riskPerLot = distance * contractSize;
        const lotSize = riskAmount / riskPerLot;

        riskAmountSpan.innerText = "$" + riskAmount.toFixed(2);
        distanceSpan.innerText = distance.toFixed(symbol === 'XAUUSD' ? 2 : 5);
        lotResultSpan.innerText = lotSize.toFixed(2);
    }
</script>

</body>
</html>
